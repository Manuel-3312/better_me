name: better_me
description: "TFG de DAM. App que gestiona entrenamientos y dietas con IA."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # SQLite dependencies for Mobile and Desktop/Windows
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0

  path: ^1.8.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.2.4
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - .env
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/better_me.ico"
  min_sdk_android: 21